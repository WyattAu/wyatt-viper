[package]
name = "viper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wyatt-viper — Battlesnake entry: axum webhook server over a pure, unit-tested core"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
